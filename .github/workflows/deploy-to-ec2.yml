name: Build and Deploy to EC2

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get buildtools version
        run: |
          echo "Buildtools version pnpm: $(pnpm -v)"
          echo "Buildtools version node: $(node -v)"
          echo "Buildtools version npm : $(npm -v)"

      # - name: Install dependencies
      #   run: pnpm install

      # - name: Generate Prisma Clients
      #   run: pnpm generate

      - name: create empty tar
        run: touch app.tar.gz

      - name: Archive application
        run: tar --exclude=app.tar.gz -czf app.tar.gz .

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.tar.gz"
          target: "${{ secrets.EC2_PATH }}"

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_PATH }}
            tar -xzf app.tar.gz
            pnpm install
            pnpm generate
            pnpm build
            pnpm start -y


      # - name: create empty tar
      #   run: touch app.tar.gz

      # - name: Archive application
      #   run: tar --exclude=app.tar.gz -czf app.tar.gz .

      # - name: Upload to EC2
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     source: "app.tar.gz"
      #     target: "${{ secrets.EC2_PATH }}"

      # - name: SSH into EC2 and deploy
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     script: |
      #       cd ${{ secrets.EC2_PATH }}
      #       tar -xzf app.tar.gz
      #       npm install --production
      #       pm2 restart simple-node-app || pm2 start app.js --name simple-node-app



